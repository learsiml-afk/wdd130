<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Black River Rafting</title>
    <meta name="description"
      content="Get in touch with Black River Rafting for reservations, general inquiries, or website feedback. Located in Kolob, California.">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/z-crossedoars.jpeg" alt="WWR Logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <section class="contact-header">
            <h1 class="company-name-title">Black River Rafting</h1>
            <p>Crash Boat Beach, Borinquen, Aguadilla 00603, Puerto Rico</p>
            <p>+1 999 999 9999</p>
            <p>info@blackriverrafting.com</p>
        </section>

        <div class="contact-grid">
            <div class="map-container">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d18310.733216308032!2d-67.17043424789327!3d18.461310021823376!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8c02bd18c7e9af05%3A0xbd927de3237db2ee!2sCrash%20Boat%20Beach!5e1!3m2!1ses!2smx!4v1775531299115!5m2!1ses!2smx"
                  width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>

            <form action="#" method="post">
                <div class="form-item">
                    <label for="full-name">Name</label>
                    <input type="text" id="full-name" name="user_name" placeholder="Full Name"
                      required>
                </div>

                <div class="form-item">
                    <label for="user-email">Email</label>
                    <input type="email" id="user-email" name="user_email"
                      placeholder="Email Address" required>
                </div>

                <fieldset>
                    <legend>Message Purpose</legend>

                    <div class="radio-option">
                        <input type="radio" id="general" name="purpose" value="general">
                        <label for="general">General Inquiry</label>
                    </div>

                    <div class="radio-option">
                        <input type="radio" id="reservation" name="purpose" value="reservation">
                        <label for="reservation">Reservation Question</label>
                    </div>

                    <div class="radio-option">
                        <input type="radio" id="suggestion" name="purpose" value="suggestion">
                        <label for="suggestion">Website Suggestion</label>
                    </div>
                </fieldset>

                <div class="form-item">
                    <label for="message-box">Message</label>
                    <textarea id="message-box" name="user_message"
                      placeholder="Type here"></textarea>
                </div>

                <div class="form-item checkbox-group">
                    <input type="checkbox" id="subscribe" name="newsletter_opt_in">
                    <label for="subscribe">Please subscribe me to the monthly newsletter</label>
                </div>

                <button type="submit">Get in Touch!</button>
            </form>
        </div>

        <section class="employee-profiles">
            <h2>We Are Here to Serve You</h2>
            <div class="profile-grid">
                <figure>
                    <img src="images/profile1.jpg" alt="General Manager and Founder">
                    <figcaption>Paco Ross - General Manager</figcaption>
                </figure>
                <figure>
                    <img src="images/profile2.jpg" alt="Head of Guide Teams">
                    <figcaption>Eugenio Smith - Head Guide</figcaption>
                </figure>
                <figure>
                    <img src="images/profile3.jpg" alt="Costumer Service Agent ">
                    <figcaption>Dionisio McConkie - Customer Service</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 | Black River Rafting | Israel Martinez</p>
        <nav class="socialmedia">
            <a href="https://facebook.com"><img src="images/facebook.png" alt="Facebook icon"></a>
            <a href="https://linkedin.com"><img src="images/linkedin.png" alt="LinkedIn icon"></a>
            <a href="https://instagram.com"><img src="images/instagram.png"
                  alt="Instagram icon "></a>
        </nav>
    </footer>
</body>

</html>
