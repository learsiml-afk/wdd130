<DOCTYPE html>
    <html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title> HTML and CSS Fundamental Quiz</title>
        <link rel="stylesheet" href="styles/quiz.css">
    </head>

    <body>

        <h1> HTML and CSS Web Development Quiz</h1>
        <form action="#" method="post">

            <div class="question-group">
                <label for="q1">1. Fill in the blank: The HTML element used to create a hyperlink is
                    the
                    &lt;____&gt; tag.</label>
                <input type="text" name="q1" id="q1" placeholder="e.g., a" required>
            </div>

            <div class="question-group">
                <label for="q2">2. Short Answer: Briefly explain the difference between padding and
                    margin
                    in CSS.</label>
                <textarea name="q2" id="q2" placeholder="Write your answer here..."
                  required></textarea>
            </div>

            <div class="question-group">
                <label for="q3">3. Which CSS property is used to change the text color of an
                    element?</label>
                <select name="q3" id="q3" required>
                    <option value="" selected disabled>Choose One ...</option>
                    <option value="font-style">font-style</option>
                    <option value="color">color</option>
                    <option value="background-color">background-color</option>
                </select>
            </div>

            <div class="question-group">
                <label for="q4">4. How many levels of headings are available in HTML (e.g., h1
                    through
                    hX)?</label>
                <input type="number" name="q4" id="q4" min="1" max="10" required>
            </div>

            <button type="submit">Submit Quiz</button>

        </form>


    </body>


</DOCTYPE>
